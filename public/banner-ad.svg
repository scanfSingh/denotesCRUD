<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    
    <!-- Purple glow gradient -->
    <radialGradient id="purpleGlow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Pink glow gradient -->
    <radialGradient id="pinkGlow" cx="70%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#e879f9"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    
    <!-- Button gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    
    <!-- Icon gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glow effects -->
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#pinkGlow)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="200" fill="rgba(139,92,246,0.1)" filter="blur(40px)"/>
  <circle cx="1050" cy="530" r="180" fill="rgba(236,72,153,0.1)" filter="blur(40px)"/>
  
  <!-- Left side content -->
  <g transform="translate(80, 180)">
    <!-- Logo icon -->
    <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#iconGrad)"/>
    <text x="35" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="white" text-anchor="middle">d</text>
    
    <!-- Brand name -->
    <text x="90" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="url(#textGrad)">denotes</text>
  </g>
  
  <!-- Main headline -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white">
    Organize Your Mind.
  </text>
  <text x="80" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)">
    Capture Every Idea.
  </text>
  
  <!-- Subheadline -->
  <text x="80" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">
    Notes • Tasks • Topics • Voice Recording • Collaboration
  </text>
  
  <!-- CTA Button -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="280" height="60" rx="16" fill="url(#btnGrad)"/>
    <text x="140" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">Get Started Free →</text>
  </g>
  
  <!-- Website URL -->
  <text x="80" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">
    denotes.co.in
  </text>
  
  <!-- Right side - Feature cards mockup -->
  <g transform="translate(700, 120)">
    <!-- Card 1 - Tasks -->
    <g transform="rotate(-5)">
      <rect x="0" y="0" width="280" height="160" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(59,130,246,0.2)"/>
      <text x="40" y="48" font-size="20" text-anchor="middle">✓</text>
      <text x="75" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Task Manager</text>
      <rect x="20" y="75" width="180" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
      <rect x="20" y="75" width="120" height="8" rx="4" fill="rgba(59,130,246,0.5)"/>
      <text x="20" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">3 tasks completed today</text>
      <rect x="20" y="125" width="240" height="1" fill="rgba(255,255,255,0.05)"/>
      <circle cx="35" cy="145" r="8" fill="rgba(34,197,94,0.3)"/>
      <circle cx="55" cy="145" r="8" fill="rgba(234,179,8,0.3)"/>
      <circle cx="75" cy="145" r="8" fill="rgba(239,68,68,0.3)"/>
    </g>
    
    <!-- Card 2 - Topics -->
    <g transform="translate(40, 140) rotate(3)">
      <rect x="0" y="0" width="280" height="160" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(139,92,246,0.2)"/>
      <text x="40" y="48" font-size="20" text-anchor="middle">📝</text>
      <text x="75" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Topic Organization</text>
      <rect x="20" y="75" width="100" height="24" rx="6" fill="rgba(139,92,246,0.2)"/>
      <text x="70" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(167,139,250,1)" text-anchor="middle">Technology</text>
      <rect x="130" y="75" width="80" height="24" rx="6" fill="rgba(236,72,153,0.2)"/>
      <text x="170" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(244,114,182,1)" text-anchor="middle">Design</text>
      <rect x="20" y="110" width="70" height="24" rx="6" fill="rgba(34,197,94,0.2)"/>
      <text x="55" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(74,222,128,1)" text-anchor="middle">Ideas</text>
    </g>
    
    <!-- Card 3 - Audio -->
    <g transform="translate(80, 290) rotate(-2)">
      <rect x="0" y="0" width="280" height="140" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="20" y="20" width="40" height="40" rx="10" fill="rgba(239,68,68,0.2)"/>
      <text x="40" y="48" font-size="20" text-anchor="middle">🎤</text>
      <text x="75" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">Voice Notes</text>
      <!-- Audio waveform -->
      <g transform="translate(20, 75)">
        <rect x="0" y="15" width="4" height="20" rx="2" fill="rgba(239,68,68,0.6)"/>
        <rect x="8" y="10" width="4" height="30" rx="2" fill="rgba(239,68,68,0.7)"/>
        <rect x="16" y="5" width="4" height="40" rx="2" fill="rgba(239,68,68,0.8)"/>
        <rect x="24" y="12" width="4" height="26" rx="2" fill="rgba(239,68,68,0.7)"/>
        <rect x="32" y="8" width="4" height="34" rx="2" fill="rgba(239,68,68,0.8)"/>
        <rect x="40" y="15" width="4" height="20" rx="2" fill="rgba(239,68,68,0.6)"/>
        <rect x="48" y="5" width="4" height="40" rx="2" fill="rgba(239,68,68,0.9)"/>
        <rect x="56" y="10" width="4" height="30" rx="2" fill="rgba(239,68,68,0.7)"/>
        <rect x="64" y="18" width="4" height="14" rx="2" fill="rgba(239,68,68,0.5)"/>
        <rect x="72" y="12" width="4" height="26" rx="2" fill="rgba(239,68,68,0.6)"/>
        <rect x="80" y="8" width="4" height="34" rx="2" fill="rgba(239,68,68,0.7)"/>
        <rect x="88" y="15" width="4" height="20" rx="2" fill="rgba(239,68,68,0.5)"/>
      </g>
      <text x="140" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">0:42 / 1:23</text>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="650" cy="315" r="4" fill="rgba(139,92,246,0.6)"/>
  <circle cx="680" cy="400" r="3" fill="rgba(236,72,153,0.5)"/>
  <circle cx="620" cy="250" r="2" fill="rgba(167,139,250,0.4)"/>
  
  <!-- Border glow effect -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="url(#btnGrad)" stroke-width="2" opacity="0.3"/>
</svg>


