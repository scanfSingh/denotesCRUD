<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    
    <linearGradient id="textGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#e879f9"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    
    <linearGradient id="btnGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="728" height="90" fill="url(#bgGrad3)"/>
  
  <!-- Subtle glow -->
  <ellipse cx="200" cy="45" rx="200" ry="60" fill="rgba(139,92,246,0.1)"/>
  <ellipse cx="528" cy="45" rx="150" ry="50" fill="rgba(236,72,153,0.08)"/>
  
  <!-- Logo -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#iconGrad3)"/>
    <text x="25" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">d</text>
  </g>
  
  <!-- Brand name -->
  <text x="90" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#textGrad3)">denotes</text>
  
  <!-- Separator -->
  <rect x="220" y="25" width="1" height="40" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Tagline -->
  <text x="240" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)">Organize Your Mind</text>
  <text x="240" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">Notes • Tasks • Voice • Collaboration</text>
  
  <!-- Features icons -->
  <g transform="translate(480, 45)">
    <text x="0" y="5" font-size="18">✓</text>
    <text x="25" y="5" font-size="18">📝</text>
    <text x="50" y="5" font-size="18">🎤</text>
    <text x="75" y="5" font-size="18">🔗</text>
  </g>
  
  <!-- CTA Button -->
  <g transform="translate(580, 20)">
    <rect x="0" y="0" width="130" height="50" rx="12" fill="url(#btnGrad3)"/>
    <text x="65" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Try Free →</text>
    <text x="65" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle">denotes.co.in</text>
  </g>
  
  <!-- Border -->
  <rect x="0" y="0" width="728" height="90" fill="none" stroke="url(#btnGrad3)" stroke-width="1" opacity="0.3"/>
</svg>


